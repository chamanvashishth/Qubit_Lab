<svg width="1600" height="600" viewBox="0 0 1600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">QubitLab — Interactive Quantum Computing Platform</title>
<desc id="desc">A dark quantum-themed banner with orbital paths, glowing qubits, and the QubitLab title.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#050816"/>
    <stop offset="55%" stop-color="#0b1730"/>
    <stop offset="100%" stop-color="#06101b"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0%" stop-color="#22d3ee" stop-opacity=".75"/>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1600" height="600" fill="url(#bg)"/>
<circle cx="1180" cy="290" r="240" fill="url(#glow)" filter="url(#blur)" opacity=".55"/>
<g fill="none" stroke="#38bdf8" stroke-opacity=".35">
  <ellipse cx="1180" cy="290" rx="310" ry="120" stroke-width="2"/>
  <ellipse cx="1180" cy="290" rx="250" ry="200" stroke-width="2" transform="rotate(38 1180 290)"/>
  <ellipse cx="1180" cy="290" rx="220" ry="250" stroke-width="2" transform="rotate(-42 1180 290)"/>
</g>
<g>
  <circle cx="1180" cy="290" r="54" fill="#081b2d" stroke="#67e8f9" stroke-width="4"/>
  <circle cx="1180" cy="290" r="14" fill="#67e8f9"/>
  <circle cx="1455" cy="305" r="13" fill="#a78bfa"/>
  <circle cx="1005" cy="195" r="11" fill="#22d3ee"/>
  <circle cx="1300" cy="105" r="10" fill="#f0abfc"/>
</g>
<g fill="#dbeafe">
  <text x="120" y="220" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800" letter-spacing="2">QubitLab</text>
  <text x="125" y="285" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#67e8f9">INTERACTIVE QUANTUM COMPUTING</text>
  <text x="125" y="350" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#94a3b8">Learn. Build. Visualize. Experiment.</text>
</g>
<g stroke="#1e3a5f" stroke-width="1" opacity=".7">
  <path d="M0 500 H1600"/>
  <path d="M0 100 H1600"/>
  <path d="M250 0 V600"/>
  <path d="M600 0 V600"/>
</g>
</svg>